name: Deploy to Turbify (FTPS)

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "fh6-random-race-gen.html"
      - "fh6-map.jpg"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage only the files the live site needs
        run: |
          mkdir deploy
          cp index.html fh6-random-race-gen.html fh6-map.jpg deploy/

      - name: FTPS deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # FTP_USERNAME is a dedicated account scoped to public_html/fh6,
          # so its login root ("/") already IS that folder.
          server-dir: /
          local-dir: ./deploy/
          dangerous-clean-slate: false
